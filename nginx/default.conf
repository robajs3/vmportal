map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # Wgrywanie ISO: surowe body (do kilkunastu GB) leci strumieniem do Flaska,
    # bez limitu 1 MB i bez buforowania na dysku nginxa. Regex łapie też wariant z prefiksem /vmka1.
    location ~ ^(/vmka1)?/isos/upload$ {
        client_max_body_size 16g;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://flask:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /vmka1;
    }

    # Klonowanie maszyny: kopiowanie dysku trwa minuty, a żądanie jest synchroniczne
    # (domyślny proxy_read_timeout to tylko 60 s -> 504 mimo że klonowanie się udaje).
    location ~ ^(/vmka1)?/vms/[0-9]+/clone$ {
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://flask:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /vmka1;
    }

    # Wgrywanie wtyczek do przeglądarek (do 80 MB) potrzebuje większego limitu body.
    location ~ ^(/vmka1)?/browsers/extensions/upload$ {
        client_max_body_size 90m;
        proxy_pass http://flask:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /vmka1;
    }

    location / {
        proxy_pass http://flask:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /vmka1;
    }

    # Pytamy portal (Flask), kto to jest i czy ma dostęp — przy każdym żądaniu do Guacamole.
    location = /_guac_auth {
        internal;
        proxy_pass http://flask:5000/_guac_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /vmka1;
    }

    location @guac_login {
        return 302 /vmka1/guac-denied;
    }

    location /guacamole/ {
        auth_request /_guac_auth;
        auth_request_set $guac_user $upstream_http_x_guac_user;
        error_page 401 = @guac_login;

        # Zawsze nadpisujemy nagłówek (klient nie może podstawić własnego).
        proxy_set_header X-Guac-User $guac_user;

        proxy_pass http://guacamole:8080/guacamole/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        access_log off;
    }

    # --- Przeglądarki (neko): /br/<id>/ -> kontener vmbr-<id> w sieci vmportal_br_net ---------
    # Właściciela sesji sprawdza portal (auth_request); adres kontenera rozwiązuje DNS Dockera
    # w momencie żądania, więc nginx nie musi znać sesji z góry.
    location = /_br_auth {
        internal;
        proxy_pass http://flask:5000/_br_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /vmka1;
        proxy_set_header X-Original-URI $request_uri;
    }

    location @br_denied {
        return 302 /vmka1/browsers;
    }

    location ~ ^/br/(?<br_id>[0-9a-f]{12})/ {
        auth_request /_br_auth;
        error_page 401 403 = @br_denied;

        resolver 127.0.0.11 valid=5s ipv6=off;
        proxy_pass http://vmbr-$br_id:8080;   # pełna ścieżka (z prefiksem) idzie do neko

        proxy_set_header Cookie "";           # ciasteczko sesji portalu nie trafia do sesji przeglądarki
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        access_log off;
    }
}