# Snippet dla nginxa HOSTA — kieruje /vmka1/ do stacku vmportal (127.0.0.1:8001).
# Włącz wewnątrz bloku server { } obok location /koloseum:
#     include /home/robajs/vm-portal/deploy/nginx-host/vmka1.conf;
# Wymaga też deploy/nginx-host/vmportal-map.conf w /etc/nginx/conf.d/.
# Potem: sudo nginx -t && sudo systemctl reload nginx

location /vmka1/ {
    proxy_pass http://127.0.0.1:8001/;   # slash na końcu odcina /vmka1; nginx stacku i tak dopisuje X-Script-Name
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # websockety (Guacamole, przeglądarki neko)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $vmportal_connection_upgrade;

    # upload ISO / wtyczek, klonowanie VM
    client_max_body_size 16g;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# /vmka1 bez końcowego slasha
location = /vmka1 { return 301 /vmka1/; }
