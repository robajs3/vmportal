<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Udostępniona maszyna — VM Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="auth-box">
        <h1>Udostępniona maszyna</h1>
        <p>Ta maszyna wirtualna jest chroniona hasłem. Podaj hasło, które dostałeś razem z linkiem.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST" autocomplete="off">
            <label for="password">Hasło</label>
            <input type="password" id="password" name="password" required autofocus autocomplete="off">
            <button type="submit">Wejdź</button>
        </form>
    </div>
</body>
</html>
