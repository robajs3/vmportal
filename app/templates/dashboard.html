<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel — VM Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="topbar">
        <span>Zalogowano jako: <strong>{{ user.username }}</strong></span>
        <a href="{{ url_for('logout') }}">Wyloguj</a>
    </div>

    <div class="dashboard">
        <h1>Twoje maszyny wirtualne</h1>

        {% if vms|length == 0 %}
            <p>Brak skonfigurowanych maszyn wirtualnych.</p>
        {% else %}
            <div class="vm-grid">
                {% for vm in vms %}
                <div class="vm-card">
                    <h2>{{ vm.name }}</h2>
                    <p>{{ vm.description or "" }}</p>
                    <a class="connect-btn" href="{{ vm.guacamole_url }}" target="_blank" rel="noopener">
                        Połącz →
                    </a>
                </div>
                {% endfor %}
            </div>
        {% endif %}
    </div>
</body>
</html>
