services:
  postgres:
    image: postgres:16-alpine
    container_name: vmportal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w .env}
      POSTGRES_DB: postgres
      # Używane tylko przez skrypty w db-init/ (przy pierwszym starcie z pustym pgdata)
      APP_DB_USER: ${APP_DB_USER:-vmportal_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Ustaw APP_DB_PASSWORD w .env}
      GUAC_ADMIN_USER: ${GUAC_ADMIN_USER:-guacadmin}
      DATABASE_URL: postgresql://${APP_DB_USER:-vmportal_app}:${APP_DB_PASSWORD}@postgres:5432/app_db
      GUAC_ADMIN_PASSWORD: ${GUAC_ADMIN_PASSWORD:?Ustaw GUAC_ADMIN_PASSWORD w .env}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vmportal-net
      # LoginHub (panel admina) czyta stąd listę userów do łączenia kont
      - sso_net

  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    restart: unless-stopped
    volumes:
      - ./drive:/drive:rw
      - ./record:/record:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vmportal-net

  guacamole:
    image: guacamole/guacamole:latest
    container_name: guacamole-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_started
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-pguser}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w .env}
      # Logowanie przez nagłówek ustawiany przez nginx po weryfikacji w portalu
      # (konta i uprawnienia nadal siedzą w bazie Postgres).
      HEADER_ENABLED: "true"
      HTTP_AUTH_HEADER: X-Guac-User
    networks:
      - vmportal-net

  # Wąskie proxy do socketu Dockera: portal może tylko zarządzać kontenerami i wolumenami
  # sesji przeglądarek (bez obrazów, sieci, exec, swarm...). Nie wystawiamy go na zewnątrz.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: vmportal-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      VOLUMES: 1
      POST: 1
      DELETE: 1
      IMAGES: 0
      NETWORKS: 0
      EXEC: 0
      INFO: 0
      SERVICES: 0
      TASKS: 0
      SWARM: 0
      SECRETS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_net

  # Obrazy sesji przeglądarki i runnera skryptów - tylko do zbudowania:
  #   docker compose --profile build build
  browser-image:
    profiles: ["build"]
    build: ./browser-image
    image: vmportal-browser:latest
  runner-image:
    profiles: ["build"]
    build: ./runner
    image: vmportal-runner:latest

  flask:
    build: ./app
    container_name: vmportal-flask
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    group_add:
      - "${LIBVIRT_GID:-979}"
    volumes:
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock
      - br_extensions:/data/extensions   # wgrane wtyczki (sesje montują je tylko do odczytu)
    environment:
      SECRET_KEY: ${SECRET_KEY:?Ustaw SECRET_KEY w .env}
      # Połączenie z bazą składane w aplikacji z osobnych zmiennych
      # (dzięki temu hasło może zawierać znaki specjalne)
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${APP_DB_NAME:-app_db}
      DB_USER: ${APP_DB_USER:-vmportal_app}
      DB_PASSWORD: ${APP_DB_PASSWORD:?Ustaw APP_DB_PASSWORD w .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Ustaw ADMIN_PASSWORD w .env}
      GUACAMOLE_PUBLIC_URL: ${GUACAMOLE_PUBLIC_URL:-/vmka1/guacamole/}
      GUAC_INTERNAL_URL: ${GUAC_INTERNAL_URL:-http://guacamole:8080/guacamole}
      GUAC_ADMIN_USER: ${GUAC_ADMIN_USER:-guacadmin}
      GUAC_ADMIN_PASSWORD: ${GUAC_ADMIN_PASSWORD:?Ustaw GUAC_ADMIN_PASSWORD w .env}
      VM_HOST: ${VM_HOST:-host.docker.internal}
      MAX_ISO_MB: ${MAX_ISO_MB:-10240}
      # SSO (LoginHub) — SSO_SECRET musi być DOKŁADNIE tą samą wartością co w .env LoginHub.
      # hub-web to nazwa kontenera LoginHub w sieci sso_net.
      SSO_SECRET: ${SSO_SECRET:-}
      HUB_INTERNAL_URL: ${HUB_INTERNAL_URL:-http://hub-web:8000}
      # Dev login (/devlogin) — hasło, tylko z LAN. Puste = wyłączone.
      DEVLOGIN_PASSWORD: ${DEVLOGIN_PASSWORD:-}
      DEVLOGIN_ALLOWED_HOSTS: ${DEVLOGIN_ALLOWED_HOSTS:-}
      # --- Przeglądarki ---
      BROWSER_DOCKER_HOST: tcp://docker-proxy:2375
      BROWSER_POOL_RAM_MB: ${BROWSER_POOL_RAM_MB:-4096}
      BROWSER_OVERCOMMIT: ${BROWSER_OVERCOMMIT:-1.5}
      BROWSER_DEFAULT_RAM_MB: ${BROWSER_DEFAULT_RAM_MB:-768}
      BROWSER_MAX_RAM_MB: ${BROWSER_MAX_RAM_MB:-2048}
      BROWSER_PUBLIC_IP: ${BROWSER_PUBLIC_IP:-}
      BROWSER_RTC_PORT_MIN: ${BROWSER_RTC_PORT_MIN:-52000}
      BROWSER_RTC_PORT_MAX: ${BROWSER_RTC_PORT_MAX:-52099}
      BROWSER_FPS: ${BROWSER_FPS:-15}
      BROWSER_ADMIN_CAN_VIEW: ${BROWSER_ADMIN_CAN_VIEW:-0}
    networks:
      - vmportal-net
      - sso_net
      - br_net        # sondowanie sesji neko (czy ktoś ogląda)
      - docker_net    # tylko do docker-proxy

  nginx:
    image: nginx:alpine
    container_name: vmportal-nginx
    restart: unless-stopped
    depends_on:
      - flask
      - guacamole
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8001:80"
    networks:
      - vmportal-net
      - br_net        # nginx proxuje /br/<id>/ do kontenerów sesji

volumes:
  # Stała nazwa - portal montuje ten wolumen do kontenerów sesji po nazwie.
  br_extensions:
    name: vmportal_br_extensions

networks:
  vmportal-net:
    driver: bridge
  # Sesje przeglądarek mieszkają tu - bez dostępu do Postgresa i Guacamole.
  br_net:
    name: vmportal_br_net
    driver: bridge
  # Tylko flask <-> docker-proxy (bez wyjścia na zewnątrz).
  docker_net:
    internal: true
  # Wspólna sieć z LoginHub: docker network create sso_net (raz)
  sso_net:
    external: true
