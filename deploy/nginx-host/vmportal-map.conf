# Wrzuć do /etc/nginx/conf.d/vmportal-map.conf (kontekst http{}, ładowany automatycznie
# przez "include /etc/nginx/conf.d/*.conf;"). Osobna nazwa zmiennej, żeby nie kolidować
# z ewentualnym istniejącym "map $http_upgrade $connection_upgrade".
map $http_upgrade $vmportal_connection_upgrade {
    default upgrade;
    ''      close;
}
