services:
  postgres:
    image: postgres:16-alpine
    container_name: vmportal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: USUNIETE
      POSTGRES_DB: postgres
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vmportal-net

  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    restart: unless-stopped
    volumes:
      - ./drive:/drive:rw
      - ./record:/record:rw
    networks:
      - vmportal-net

  guacamole:
    image: guacamole/guacamole:latest
    container_name: guacamole-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_started
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USERNAME: pguser
      POSTGRESQL_PASSWORD: USUNIETE
    networks:
      - vmportal-net

  flask:
    build: ./app
    container_name: vmportal-flask
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRET_KEY: f8a3c1e9b2d74a6f91038e5c7b2a4d6e
      DATABASE_URL: postgresql://vmportal_app:USUNIETE@postgres:5432/app_db
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: USUNIETE
      GUACAMOLE_PUBLIC_URL: /vmka1/guacamole/
    networks:
      - vmportal-net

  nginx:
    image: nginx:alpine
    container_name: vmportal-nginx
    restart: unless-stopped
    depends_on:
      - flask
      - guacamole
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8001:80"
    networks:
      - vmportal-net

networks:
  vmportal-net:
    driver: bridge
